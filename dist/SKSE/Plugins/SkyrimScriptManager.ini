[Report]

; A report goes into SkyrimScriptManager.log this often, in seconds (5 to 3600).
fIntervalSeconds=60

; When overstress begins a report also goes in, at least this many seconds after the last one (1 to 600).
fOverstressGapSeconds=10

; While overstress is on, the stacks are read this often, in seconds (0.5 to 60). Otherwise they are read only at a report.
fOverstressSampleSeconds=2

; Rows in each top list (1 to 50).
iTopRows=10

[Walk]

; One reading of the stacks stops at this many stacks (16 to 100000) or this many milliseconds (0.5 to 50), and the log says so.
iMaxStacksPerWalk=4000
fMaxWalkMS=4

[Roles]

; 1 reads each script the game has loaded, on a thread of its own, and writes SkyrimScriptManager_Roles.txt. 0 turns that off.
bClassifyScripts=1

[LoopWatch]

; Watches for one object taking the same event at an abnormal rate, stacks piling on one object, and recursion. It only writes it down.
bLoopWatch=1

; Events an object should take once when it loads or starts (OnEffectStart, OnEffectFinish, OnLoad, OnUnload, OnCellAttach, OnCellDetach,
; OnAttachedToCell, OnDetachedFromCell, OnInit): per second per object, and how many seconds in a row. A cell load is one burst and then
; nothing, which the seconds in a row rule out. An effect's events count for the actor it is on.
fOneShotRate=15
iSustainSeconds=3

; An actor's cell attach or detach and any object's 3D load or unload, per second. Uses iSustainSeconds too.
fAttachRate=5

; Any other event, per second per object, and how many seconds in a row.
fOtherRate=100
iOtherSustainSeconds=5

; Below the rate this many seconds in a row and a detection ends.
iReleaseSeconds=3

; Stacks on one object at one reading of the stacks.
iStacksOnOneObject=200

; A stack this many frames deep, or the same function on it this many times. Report only: a stack past 1000 frames is what Recursion Monitor ends.
iDeepFrames=50
iSameFunctionFrames=8

[Manage]

; 0 as shipped. 1 lets a short list of read-only native calls (HasKeyword, GetBaseObject and the like, reads of a record's own data)
; answer at once instead of waiting for the frame, using the VM's own SetCallableFromTasklets. It stands aside if Papyrus Tweaks'
; bSpeedUpNativeCalls is on, and it needs a restart to turn off. Not yet proven in game.
bFastReads=0

; 0 as shipped. 1 lets the loop watch act, on one thing only: when an actor is caught with its magic effects restarting over and over
; while the VM is overstressed, repeats of OnEffectStart and their OnEffectFinish on that actor are dropped until the rate falls. Each
; effect keeps its start and finish in balance, and any effect still running at the end gets its start then. No other event is ever
; dropped. It needs bLoopWatch=1, and it turns itself off for the session on any error. Not yet proven in game.
bLoopGuard=0

[HangRecorder]

; 1 as shipped. When no frame comes for fStallSeconds (5 to 600), a thread of its own writes the main thread's stack, the other threads in
; the game and in SKSE plugins, the read calls in flight and the last 64 of them, the load state and the script engine's state to
; SkyrimScriptManager.log, and again a minute later if it lasts. It takes no game lock. A long loading screen can set it off too; the log
; then says when frames came back. 0 turns it off.
bHangRecorder=1
fStallSeconds=15

[Debug]

; Sets the level of detail in the log: 0 = trace, 1 = debug, 2 = info, 3 = warning, 4 = error, 5 = critical error
uLogLevel=2
