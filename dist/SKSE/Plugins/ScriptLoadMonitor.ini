[Report]

; A report goes into ScriptLoadMonitor.log this often, in seconds (5 to 3600).
fIntervalSeconds=60

; When overstress begins a report also goes in, at least this many seconds after the last one (1 to 600).
fOverstressGapSeconds=10

; While overstress is on, the stacks are read this often, in seconds (0.5 to 60). Otherwise they are read only at a report.
fOverstressSampleSeconds=2

; Rows in each top list (1 to 50).
iTopRows=10

[Walk]

; One reading of the stacks stops at this many stacks (16 to 100000) or this many milliseconds (0.5 to 50), and the log says so.
iMaxStacksPerWalk=4000
fMaxWalkMS=4

[Roles]

; 1 reads each script the game has loaded, on a thread of its own, and writes ScriptLoadMonitor_Roles.txt. 0 turns that off.
bClassifyScripts=1

[Manage]

; 0 as shipped. 1 lets a short list of read-only native calls (HasKeyword, GetBaseObject and the like, reads of a record's own data)
; answer at once instead of waiting for the frame, using the VM's own SetCallableFromTasklets. It stands aside if Papyrus Tweaks'
; bSpeedUpNativeCalls is on, and it needs a restart to turn off. Not yet proven in game.
bFastReads=0

[Debug]

; Sets the level of detail in the log: 0 = trace, 1 = debug, 2 = info, 3 = warning, 4 = error, 5 = critical error
uLogLevel=2
